name: Recomp regression and native acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core, coordinator, server, native crypto and simulator UI tests
        run: ./scripts/check.sh --require-native
      - name: Preserve native logs, screenshots and XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recomp-native-results
          path: .native-results/
          include-hidden-files: true
          if-no-files-found: warn
